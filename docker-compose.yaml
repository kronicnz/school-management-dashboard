version: '3.9'
services:
  supabase:
    image: supabase/supabase:latest
    ports:
      - 54321:54321
      - 54322:54322
      - 54323:54323
      - 54324:54324
    volumes:
      - ./supabase:/supabase
    environment:
      - SUPABASE_URL=http://localhost:54321
      - SUPABASE_ANON_KEY=replace_me
      - SUPABASE_SERVICE_ROLE_KEY=replace_me
  worker:
    build: ./supabase-utils/worker
    depends_on:
      - supabase
    environment:
      - SUPABASE_URL=http://supabase:54321
      - SUPABASE_SERVICE_ROLE_KEY=replace_me
    ports:
      - 3001:3001
